<style>

.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);font-weight:800;cursor:pointer}.btn.blue{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.secondary{background:#30353a;color:#fff}.btn.danger{background:var(--danger);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}

.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.section-title{font-size:20px;font-weight:900}.price-item{display:grid;grid-template-columns:1fr 95px 120px auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.price-item:last-child{border-bottom:0}
.editor-section{margin-bottom:14px}.editor-service{display:grid;grid-template-columns:1fr 90px 120px auto;gap:8px;align-items:center;margin-top:8px}.hint{padding:12px;border:1px dashed #4b535b;border-radius:10px;color:var(--muted);margin-top:12px}
@media(max-width:900px){.side{width:72px;padding:12px 8px}.logo{font-size:0;text-align:center}.logo .bolt{font-size:28px}.nav button{font-size:0;text-align:center;padding:13px}.nav button:first-letter{font-size:18px}.main{margin-left:72px;width:calc(100% - 72px);padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.catgrid{grid-template-columns:1fr 1fr}.hero h2{font-size:27px}}
@media(max-width:600px){.grid,.catgrid,.row{grid-template-columns:1fr}.top h1{font-size:22px}.main{padding:10px}.badge{display:none}.price-item{grid-template-columns:1fr 78px 95px}.price-item .item-actions{grid-column:1/-1}.editor-service{grid-template-columns:1fr 80px 105px}.editor-service .item-actions{grid-column:1/-1}.table{font-size:13px}.table th:nth-child(1),.table td:nth-child(1){display:none}}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:block;font-size:13px;font-weight:700}.form-grid input,.form-grid textarea{width:100%;margin-top:6px;box-sizing:border-box}.form-grid .wide{grid-column:1/-1}.table-wrap{overflow-x:auto}.estimate-table{width:100%;border-collapse:collapse}.estimate-table th,.estimate-table td{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:middle}.qty-control{display:flex;align-items:center;gap:4px}.qty-control button,.delete-mini{width:30px;height:30px;padding:0;border:1px solid #bbb;border-radius:7px;background:#fff;cursor:pointer}.qty-control input{width:58px;text-align:center;padding:6px}.summary{margin-top:15px;text-align:right}.summary>div{margin:5px 0}.archive-item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ddd}.archive-right{display:flex;align-items:center;gap:8px}.print-only{display:none}.order-info{margin-bottom:15px}

  const idx=price.findIndex(c=>c.name===CUSTOM_SECTION);

    price.unshift({name:CUSTOM_SECTION,items:[]});

  }
}

 <div id="items">${cat.items.length?cat.items.map((x,i)=>`<div class="price-item" data-name="${esc(x[0]).toLowerCase()}"><div><b>${esc(x[0])}</b></div><div>${esc(x[1])}</div><div>${money(x[2])} ₽</div><div class="item-actions"><div class="qty-stepper"><button onclick="changePriceQty(${currentCat},${i},-1)" aria-label="Уменьшить">−</button><input class="qnum qty-direct" type="number" min="0" step="1" inputmode="numeric" value="${getPriceQty(currentCat,i)}" onchange="setPriceQty(${currentCat},${i},this.value)" onfocus="this.select()" aria-label="Количество"><button class="plus" onclick="changePriceQty(${currentCat},${i},1)" aria-label="Увеличить">+</button></div></div></div>`).join(""):`<div class="empty">Добавь первую свою работу выше.</div>`}</div></div>`;
}
function filterItems(v){document.querySelectorAll("#items .price-item").forEach(e=>e.style.display=e.dataset.name.includes(v.toLowerCase())?"grid":"none")}
function findEstimateItem(ci,ii){const x=price[ci].items[ii];return estimate.find(e=>e.name===x[0]&&e.unit===x[1]&&Number(e.price)===Number(x[2]));}
function getPriceQty(ci,ii){const e=findEstimateItem(ci,ii);return e?Number(e.qty||0):0;}
function changePriceQty(ci,ii,delta){const x=price[ci].items[ii];const e=findEstimateItem(ci,ii);if(delta>0){if(e)e.qty=Number(e.qty||0)+1;else estimate.push({name:x[0],unit:x[1],price:Number(x[2]),qty:1,category:price[ci].name});}else if(e){e.qty=Number(e.qty||0)-1;if(e.qty<=0)estimate.splice(estimate.indexOf(e),1);}saveEstimate();render();}
function setPriceQty(ci,ii,v){const x=price[ci].items[ii];let q=Math.max(0,Math.floor(Number(v)||0));const e=findEstimateItem(ci,ii);if(q<=0){if(e)estimate.splice(estimate.indexOf(e),1);}else if(e){e.qty=q;e.category=price[ci].name;}else{estimate.push({name:x[0],unit:x[1],price:Number(x[2]),qty:q,category:price[ci].name});}saveEstimate();render();}
function addItem(ci,ii){changePriceQty(ci,ii,1);}
function calc(c){
 const total=estimate.reduce((s,x)=>s+x.qty*x.price,0);
 c.innerHTML=`<div class="row"><div class="card"><h3>Добавление позиции</h3><p class="muted">Выбирай услуги в разделе «Прайс».</p><button class="btn" onclick="go('Прайс')">Открыть прайс</button></div><div class="card"><h3>Итого</h3><div class="stat">${money(total)} ₽</div></div></div>
 <div class="card" style="margin-top:14px"><table class="table"><thead><tr><th>№</th><th>Наименование</th><th>Ед.</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th></th></tr></thead><tbody>${estimate.length?estimate.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td><input type="number" min="1" value="${x.qty}" onchange="qty(${i},this.value)"></td><td>${money(x.price)} ₽</td><td>${money(x.qty*x.price)} ₽</td><td><button class="btn danger" onclick="del(${i})">Удалить</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">Расчёт пуст. Открой «Прайс» и добавь позиции.</td></tr>`}</tbody></table>
 <div class="actions no-print" style="margin-top:15px"><button class="btn secondary" onclick="estimate=[];saveEstimate();render()">Очистить</button><button class="btn" onclick="window.print()">Печать</button></div></div>`;
}
function qty(i,v){estimate[i].qty=Math.max(1,Number(v)||1);saveEstimate();render()}
function del(i){estimate.splice(i,1);saveEstimate();render()}
function orders(c){
  const sub=estimate.reduce((s,x)=>s+Number(x.qty||1)*Number(x.price||0),0);
  const d=calcDiscount(sub);
  const f={client:orderForm.client||"",phone:orderForm.phone||"",address:orderForm.address||"",date:orderForm.date||today(),comment:orderForm.comment||"",discount:orderForm.discount||"0"};
  orderForm=f; localStorage.setItem("murad_order_form",JSON.stringify(f));
  c.innerHTML=`<div class="card print-sheet">
  <div class="estimate-client-edit no-print">
    <h3>👤 Данные клиента в смете</h3>
    <div class="estimate-client-fields">
      <label>Клиент<input id="estimateClient" value="${esc(f.client)}" placeholder="Имя клиента" oninput="syncEstimateClient('client',this.value)"></label>
      <label>Телефон<input id="estimatePhone" value="${esc(f.phone)}" placeholder="+7..." inputmode="tel" oninput="syncEstimateClient('phone',this.value)"></label>
      <label>Адрес<input id="estimateAddress" value="${esc(f.address)}" placeholder="Адрес объекта" oninput="syncEstimateClient('address',this.value)"></label>
      <label>Дата<input id="estimateDate" type="date" value="${f.date}" onchange="syncEstimateClient('date',this.value)"></label>
      <label class="discount-client-field">⚡ Скидка, %<input id="estimateDiscount" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${f.discount}" placeholder="Например: 7.5" oninput="setEstimateDiscount(this.value)" onchange="setEstimateDiscount(this.value,true)"></label>
    </div>
  </div>
  <div class="print-header">
    <div class="print-brand"><div class="print-bolt">⚡</div><div><div class="print-brand-name">MY ELECTRO</div><div class="print-brand-sub">ЭЛЕКТРОМОНТАЖНЫЕ РАБОТЫ</div></div></div>
    <div class="print-doc-title">СМЕТА</div>
    <div class="print-client-grid">
      <div><span>Клиент</span><b id="sheetClient">${esc(f.client||"—")}</b></div>
      <div><span>Телефон</span><b id="sheetPhone">${esc(f.phone||"—")}</b></div>
      <div><span>Адрес</span><b id="sheetAddress">${esc(f.address||"—")}</b></div>
      <div><span>Дата</span><b id="sheetDate">${esc(f.date||today())}</b></div>
    </div>
    ${f.comment?`<div class="print-comment"><span>Комментарий</span><b>${esc(f.comment)}</b></div>`:''}
  </div>
  <h3 class="print-work-title">Выполненные работы</h3>
  ${estimate.length?estimateTable():`<p class="muted">Пока ничего не добавлено. Откройте «Прайс» и добавьте работы.</p>`}
  <div class="summary print-summary">
    <div><span>Стоимость работ:</span><b>${money(sub)} ₽</b></div>
    <div><span>Скидка ${d.pct}%:</span><b>− ${money(d.amount)} ₽</b></div>
    <div class="print-grand-total"><span>К оплате:</span><strong>${money(d.total)} ₽</strong></div>
  </div>
  <div class="print-thanks"><div class="print-thanks-bolt">⚡</div><b>Спасибо за доверие!</b><span>MY ELECTRO</span></div>
  <div class="actions no-print"><button class="btn green" onclick="saveOrder()">${editingOrderId?"💾 Сохранить изменения":"💾 Сохранить заказ"}</button><button class="btn secondary" onclick="printOrder()">Печать / PDF</button></div>
</div>`;
}
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function estimateTable(){return `<div class="table-wrap"><table class="estimate-table"><thead><tr><th>№</th><th>Раздел</th><th>Позиция</th><th>Ед.</th><th>Количество</th><th>Цена за 1</th><th>Сумма</th><th class="no-print">Действие</th></tr></thead><tbody>${estimate.map((x,i)=>{const qty=Number(x.qty||1),sum=qty*Number(x.price||0);return `<tr><td>${i+1}</td><td>${esc(x.category||"")}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td><div class="qty-control no-print"><button onclick="changeEstimateQty(${i},-1)">−</button><input type="number" min="1" value="${qty}" onchange="setEstimateQty(${i},this.value)"><button onclick="changeEstimateQty(${i},1)">+</button></div><span class="print-only">${qty}</span></td><td>${money(x.price)} ₽</td><td>${money(sum)} ₽</td><td class="no-print"><button class="delete-mini" onclick="removeEstimate(${i})">×</button></td></tr>`}).join("")}</tbody></table></div>`}
function changeEstimateQty(i,d){estimate[i].qty=Math.max(1,Number(estimate[i].qty||1)+d);saveEstimate();render()}
function setEstimateQty(i,v){estimate[i].qty=Math.max(1,Number(v)||1);saveEstimate();render()}
function removeEstimate(i){estimate.splice(i,1);saveEstimate();render()}
function setEstimateDiscount(value,rerender){
  orderForm=orderForm||{};
  let raw=String(value??"").replace(",",".");
  let n=Number(raw);
  if(!Number.isFinite(n))n=0;
  n=Math.max(0,Math.min(100,n));
  orderForm.discount=raw===""?"0":String(n);
  localStorage.setItem(ukey("order_form"),JSON.stringify(orderForm));scheduleCloudSave();
  const old=document.getElementById("discount");
  if(old)old.value=orderForm.discount;
  if(rerender)render();
}
function syncEstimateClient(field,value){
  orderForm=orderForm||{};
  orderForm[field]=value;
  localStorage.setItem(ukey("order_form"),JSON.stringify(orderForm));

  const formMap={client:"client",phone:"phone",address:"address",date:"date"};
  const other=document.getElementById(formMap[field]);
  if(other&&other.value!==value)other.value=value;

  const sheetMap={client:"sheetClient",phone:"sheetPhone",address:"sheetAddress",date:"sheetDate"};
  const shown=document.getElementById(sheetMap[field]);
  if(shown)shown.textContent=(value&&String(value).trim())?value:"—";
}
let editingOrderId=null;
function saveOrder(){
 saveOrderForm();
 const sub=estimate.reduce((s,x)=>s+Number(x.qty||1)*Number(x.price||0),0),d=calcDiscount(sub);
 const order={id:editingOrderId||Date.now(),client:orderForm.client,phone:orderForm.phone,address:orderForm.address,date:orderForm.date||today(),comment:orderForm.comment,discount:d.pct,discountAmount:d.amount,subtotal:sub,total:d.total,items:JSON.parse(JSON.stringify(estimate))};
 if(editingOrderId){
   const idx=ordersList.findIndex(o=>String(o.id)===String(editingOrderId));
   if(idx>=0)ordersList[idx]=order; else ordersList.unshift(order);
 }else{
   ordersList.unshift(order);
 }
 localStorage.setItem(ukey("orders"),JSON.stringify(ordersList));scheduleCloudSave();
 const wasEditing=!!editingOrderId;
 editingOrderId=null;
 alert(wasEditing?"Изменения заказа сохранены":"Заказ сохранён в архиве");
 go("Архив заказов");
}
function printOrder(){saveOrderForm();window.print()}
function archive(c){c.innerHTML=`<div class="card"><h3>🗂️ Архив заказов</h3>${ordersList.length?ordersList.map((o,i)=>`<div class="archive-item"><div><b>${esc(o.client||"Без имени")}</b><div class="muted">${esc(o.date)} · ${esc(o.phone||"Телефон не указан")}</div><div class="muted">${esc(o.address||"Адрес не указан")}</div></div><div class="archive-right"><b>${money(o.total)} ₽</b><button class="btn secondary no-print" onclick="viewOrder(${i})">✏️ Редактировать</button><button class="btn danger no-print" onclick="deleteOrder(${i})">🗑️ Удалить</button></div></div>`).join(""):`<p class="muted">Архив пока пуст. Сохранённые заказы появятся здесь.</p>`}</div>`}
function viewOrder(i){
 const o=ordersList[i];
 editingOrderId=o.id;
 estimate=JSON.parse(JSON.stringify(o.items||[]));
 orderForm={client:o.client||"",phone:o.phone||"",address:o.address||"",date:o.date||today(),comment:o.comment||"",discount:o.discount||0};
 localStorage.setItem(ukey("estimate"),JSON.stringify(estimate));
 localStorage.setItem(ukey("order_form"),JSON.stringify(orderForm));scheduleCloudSave();
 go("Сметы и заказы");
}
function deleteOrder(i){
 const o=ordersList[i];
 if(confirm(`Удалить заказ ${o&&o.client?'"'+o.client+'"':""} из архива?`)){
   if(o&&String(editingOrderId)===String(o.id))editingOrderId=null;
   ordersList.splice(i,1);
   localStorage.setItem(ukey("orders"),JSON.stringify(ordersList));scheduleCloudSave();
   render();
 }
}

function panels(c){c.innerHTML=`<div class="grid">${["24 модуля","36 модулей","54 модуля","72 модуля","96 модулей"].map(x=>`<div class="card"><div class="stat">⚡</div><h3>Щит на ${x}</h3><p class="muted">Место для схемы, состава аппаратов и примечаний.</p><button class="btn secondary" onclick="alert('Раздел щита: ${x}')">Открыть</button></div>`).join("")}</div>`}
function materials(c){c.innerHTML=`<div class="grid">${["Гильзы ГМЛ","Наконечники НШВИ","Клеммы","DIN-рейка","Гофра","Крепёж","Маркировка","Расходники"].map(x=>`<div class="card"><h3>${x}</h3><p class="muted">Материалы для электромонтажа</p></div>`).join("")}</div>`}
function editor(c){
 c.innerHTML=`
 <div class="price-manager">
   <div class="manager-head">
     <div>
       <h2>🛠️ Управление прайсом</h2>
       <div class="muted">Редактируйте разделы, услуги, единицы измерения и цены.</div>
     </div>
     <div class="manager-top-actions no-print">
       <button class="btn green" onclick="addSection()">＋ Новый раздел</button>
       <button class="btn secondary" onclick="resetPrice()">↺ Исходный прайс</button>
     </div>
   </div>

   <div class="manager-list">
   ${price.map((cat,ci)=>`
     <div class="card manager-section">
       <div class="manager-section-head">
         <div class="manager-title-wrap">
           <div class="manager-number">${ci+1}</div>
           <div>
             <div class="manager-section-name">${esc(cat.name)}</div>
             <div class="muted">${cat.items.length} ${cat.items.length===1?"услуга":"услуг"}</div>
           </div>
         </div>
         <div class="manager-section-actions no-print">
           <button class="manager-btn edit" onclick="renameSection(${ci})">✏️ Переименовать</button>
           <button class="manager-btn add" onclick="addItemEditor(${ci})">＋ Добавить услугу</button>
           <button class="manager-btn remove" onclick="removeSection(${ci})">🗑️ Удалить раздел</button>
         </div>
       </div>

       <div class="manager-services">
       ${cat.items.length ? cat.items.map((x,ii)=>`
         <div class="manager-service">
           <div class="manager-service-index">${ii+1}</div>
           <label class="manager-name">Название услуги
             <input value="${attr(x[0])}" onchange="editItem(${ci},${ii},0,this.value)" placeholder="Название услуги">
           </label>
           <label>Ед.
             <input value="${attr(x[1])}" onchange="editItem(${ci},${ii},1,this.value)" placeholder="шт">
           </label>
           <label>Цена, ₽
             <input type="number" min="0" step="1" inputmode="decimal" value="${Number(x[2])}" onchange="editItem(${ci},${ii},2,this.value)">
           </label>
           <button class="manager-delete-service no-print" onclick="removeItem(${ci},${ii})" title="Удалить услугу">🗑️</button>
         </div>`).join("") : `<div class="manager-empty">В этом разделе пока нет услуг. Нажмите «＋ Добавить услугу».</div>`}
       </div>

       <button class="manager-add-bottom no-print" onclick="addItemEditor(${ci})">＋ Добавить услугу в «${esc(cat.name)}»</button>
     </div>`).join("")}
   </div>
 </div>`;
}
function addSection(){const name=prompt("Название нового раздела:");if(!name||!name.trim())return;price.push({name:name.trim(),items:[]});savePrice();render()}
function renameSection(i){const name=prompt("Новое название раздела:",price[i].name);if(name&&name.trim()){price[i].name=name.trim();savePrice();render()}}
function removeSection(i){if(!confirm("Удалить раздел и все его услуги?"))return;price.splice(i,1);savePrice();render()}
function addItemEditor(ci){const name=prompt("Название услуги:");if(!name||!name.trim())return;const unit=prompt("Единица измерения:","шт");if(!unit||!unit.trim())return;const val=prompt("Цена:","0");const n=Number(val);price[ci].items.push([name.trim(),unit.trim(),isNaN(n)?0:n]);savePrice();render()}
function editItem(ci,ii,col,val){if(col===2)price[ci].items[ii][col]=Number(val)||0;else price[ci].items[ii][col]=val;savePrice()}
function removeItem(ci,ii){if(!confirm("Удалить эту услугу?"))return;price[ci].items.splice(ii,1);savePrice();render()}
function resetPrice(){if(!confirm("Вернуть исходный прайс? Все внесённые вручную изменения будут удалены."))return;price=JSON.parse(JSON.stringify(initialPrice));price.push({name:CUSTOM_SECTION,items:[]});savePrice();render()}
function money(n){return Number(n||0).toLocaleString("ru-RU")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function attr(s){return esc(s)}
const PREVIEW_MODE=true;
async function bootApp(){
 if(PREVIEW_MODE){
   currentUser="Режим предпросмотра";
   electroId="PREVIEW";
   authUser=null;
   localStorage.setItem(APP_USER_KEY,currentUser);
   loadUserData();
   document.getElementById("authOverlay").style.display="none";
   updateUserBadge();
   const b=document.querySelector(".badge");
   if(b)b.innerHTML='<span class="user-chip">👁 Режим предпросмотра · без входа</span>';
   go("Главная");
   return;
 }
 document.getElementById("authOverlay").style.display="flex";showAuthMode("login");
 sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY")setTimeout(finishPasswordRecovery,250);if(event==="SIGNED_OUT"){document.getElementById("authOverlay").style.display="flex"}});
 const {data:{session}}=await sb.auth.getSession();if(session?.user)await enterApp(session.user);else setTimeout(()=>document.getElementById("loginEmail")?.focus(),50);
}
bootApp();
</script>
