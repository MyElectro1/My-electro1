<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Электрик Мурад — прайс и сметы</title>
<style>
:root{--bg:#0d0f10;--panel:#171a1d;--panel2:#202429;--text:#f5f5f5;--muted:#aeb4ba;--accent:#f4c400;--line:#343a40;--blue:#2478e8;--green:#27c45a;--danger:#df4d4d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.side{width:245px;background:#151719;border-right:1px solid var(--line);padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:5}
.logo{font-weight:900;font-size:21px;padding:8px 12px 22px}.bolt{color:var(--accent);font-size:28px}
.nav button{width:100%;background:none;border:0;color:#ddd;text-align:left;padding:12px 14px;border-radius:9px;font-size:15px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#2a2e32;color:#fff}.nav button.active{border-left:4px solid var(--accent)}
.main{margin-left:245px;width:calc(100% - 245px);padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:28px}.badge{background:#2b2f33;padding:8px 12px;border-radius:20px;color:#ddd}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat{font-size:29px;font-weight:900;margin-top:8px}.muted{color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,#1a1d20,#2a2f34);border-radius:18px;padding:28px;margin-bottom:18px;border:1px solid #383e44}.hero h2{font-size:35px;margin:0 0 8px}.accent{color:var(--accent)}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);font-weight:800;cursor:pointer}.btn.blue{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.secondary{background:#30353a;color:#fff}.btn.danger{background:var(--danger);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}
.search,input,select,textarea{width:100%;background:#101214;border:1px solid #3a4147;color:#fff;border-radius:8px;padding:11px}input[type=number]{max-width:150px}
.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{color:#aaa;font-size:12px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}.cat:hover{border-color:#777}.cat b{display:block;margin-bottom:7px}
.total{font-size:24px;font-weight:900;text-align:right;margin-top:15px}.empty{padding:35px;text-align:center;color:#999;background:var(--panel);border-radius:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.section-title{font-size:20px;font-weight:900}.price-item{display:grid;grid-template-columns:1fr 95px 120px auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.price-item:last-child{border-bottom:0}
.editor-section{margin-bottom:14px}.editor-service{display:grid;grid-template-columns:1fr 90px 120px auto;gap:8px;align-items:center;margin-top:8px}.hint{padding:12px;border:1px dashed #4b535b;border-radius:10px;color:var(--muted);margin-top:12px}
@media(max-width:900px){.side{width:72px;padding:12px 8px}.logo{font-size:0;text-align:center}.logo .bolt{font-size:28px}.nav button{font-size:0;text-align:center;padding:13px}.nav button:first-letter{font-size:18px}.main{margin-left:72px;width:calc(100% - 72px);padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.catgrid{grid-template-columns:1fr 1fr}.hero h2{font-size:27px}}
@media(max-width:600px){.grid,.catgrid,.row{grid-template-columns:1fr}.top h1{font-size:22px}.main{padding:10px}.badge{display:none}.price-item{grid-template-columns:1fr 78px 95px}.price-item .item-actions{grid-column:1/-1}.editor-service{grid-template-columns:1fr 80px 105px}.editor-service .item-actions{grid-column:1/-1}.table{font-size:13px}.table th:nth-child(1),.table td:nth-child(1){display:none}}
@media print{body{background:#fff;color:#000}.side,.top,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card{break-inside:avoid;background:#fff;color:#000;border-color:#ddd}.muted{color:#555}.print-only{display:block!important}.print-title{display:block!important}.print-table{color:#000!important}.print-table th,.print-table td{border-color:#ccc!important}.print-meta{color:#000!important}} .print-only,.print-title{display:none}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo"><span class="bolt">⚡</span> ЭЛЕКТРИК МУРАД</div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
  <div class="top"><h1 id="title"></h1><span class="badge">ПРАЙС • СМЕТЫ</span></div>
  <section id="content"></section>
</main>
</div>
<script>
const KEY="murad_price_v2";
const estimateKey="murad_estimate";
const ordersKey="murad_orders_v1";
const initialPrice=[
  {name:"Электромонтажные работы",items:[["Установка розетки","шт",350],["Установка выключателя","шт",300],["Монтаж точки освещения","шт",500],["Монтаж распределительной коробки","шт",700]]},
  {name:"Кабельная продукция",items:[["ВВГ 3×1,5","м",65],["ВВГ 3×2,5","м",95],["ВВГ 3×4","м",145],["ВВГ 3×6","м",210],["ПВС 3×1,5","м",60],["ПВС 3×2,5","м",90],["NYM 3×2,5","м",120],["NYM 3×4","м",170],["ШВВП 2×0,75","м",40],["КГ 3×1,5","м",85]]},
  {name:"Розетки и выключатели",items:[["Розетка Schneider","шт",350],["Выключатель Schneider","шт",320],["Розетка влагозащищённая","шт",650]]},
  {name:"Автоматы и УЗО",items:[["Автомат 16А","шт",450],["Автомат 25А","шт",480],["УЗО 40А 30мА","шт",1850]]},
  {name:"Светотехника",items:[["Установка люстры","шт",1200],["Установка бра","шт",700],["Установка точечного светильника","шт",450]]},
  {name:"Установочные изделия",items:[]},{name:"Материалы для монтажа",items:[]},{name:"Инструменты",items:[]},
  {name:"Дополнительные услуги",items:[]},{name:"Слаботочные системы",items:[]},{name:"Освещение участка",items:[]},{name:"Тёплый пол",items:[]},
  {name:"Вентиляция",items:[]},
  {name:"Установка вентиляторов",items:[["Вытяжной (вентилятор)","шт",2000],["Канальный (вентилятор)","шт",2500]]},
  {name:"Монтаж тёплого пола",items:[["Монтаж тёплого пола","м²",1500],["Термодатчик (тёплый пол)","шт",1000]]},
  {name:"Монтаж кабель-канала",items:[["Распил угла (кабель-канал)","шт",150],["Кабель-канал 16×25","п/м",150],["Кабель-канал 40×60","п/м",180],["Кабель-канал 60×100","п/м",200],["Угол, тройник, подрозетник","шт",150]]},
  {name:"Монтаж кабель-канала по потолку",items:[["Распил угла (кабель-канал по потолку)","шт",170],["Кабель-канал 16×25 (по потолку)","п/м",170],["Кабель-канал 40×60 (по потолку)","п/м",200],["Кабель-канал 60×100 (по потолку)","п/м",250]]},
  {name:"Заземление",items:[["Монтаж вертикального заземлителя Ø 18 мм","п/м",1500],["Монтаж полосовой стали 40×4","п/м",1000],["Монтаж заземлительного колодца Ø 110 мм","шт",1000],["Монтаж модульного заземлителя 6 м","шт",15000]]},
  {name:"Земляные работы",items:[["Песок","п/м",300],["Земля","п/м",500],["Грунт каменистый","п/м",1000],["Асфальт","п/м",1500],["Бетон","п/м",200],["Измерение сопротивления контура заземления","шт",3000]]},
  {name:"Установка, ремонт и обслуживание стабилизаторов",items:[["Плановое обслуживание (профилактика стабилизатора)","шт",3000],["Установка стабилизатора до 10 кВт","шт",3500],["Установка стабилизатора на кронштейны до 10 кВт","шт",5000],["Установка стабилизатора до 30 кВт","шт",5000],["Ремонт (стабилизатора) с выездом спец-та на место (1500–5000)","шт",7000]]},
  {name:"Монтаж лотков",items:[["Лоток металлический ширина до 200 мм (с заводскими поворотами и подъёмами включительно)","п/м",300],["Лоток металлический ширина до 400 мм (с заводскими поворотами и подъёмами включительно)","п/м",500],["Лоток металлический ширина до 600 мм (с заводскими поворотами и подъёмами включительно)","п/м",800],["Установка кронштейна для лотка","шт",350],["Монтаж (шпильки, троса)","шт",400]]},
  {name:"СИП монтаж",items:[["СИП 2× жильный до 25го (включительно)","п/м",250],["СИП 4× жильный до 25го (включительно)","п/м",350],["СИП 4× жильный 35й и выше по цене кабеля","п/м",0],["Затяжка в гофру 2× жильный","п/м",150],["Затяжка в гофру 4× жильный","п/м",180],["Опрессовка наконечников с подк. (до 50 сечения 1 жила)","шт",600],["Опрессовка наконечников с подк. (до 90 сечения 1 жила)","шт",800],["Крепёж для натяжителя","шт",400],["Орешек СИП 1 шт","шт",500],["Орешек АС1 шт","шт",1000],["Опора h11м (траверса, изоляторы и пролёт)","шт",18000],["Установка разъединителя","шт",20000],["Замена изолятора на траверсе","шт",5000]]},
  {name:"Муфты (бронь сшитый полиэтилен)",items:[["Муфта По низкой стороне до 95 мм² (бронь +25%)","шт",5000],["Муфта По низкой стороне до 300 мм² (бронь +25%)","шт",9000],["Муфта По высокой стороне","шт",12000],["Муфта Переключение Анцапы","шт",6000]]}
];
let price=loadPrice();
let estimate=JSON.parse(localStorage.getItem(estimateKey)||"[]");
let ordersData=JSON.parse(localStorage.getItem(ordersKey)||"[]");
let current="Главная", currentCat=null;

const navItems=[["🏠","Главная"],["💰","Прайс"],["🧮","Калькулятор"],["📋","Сметы и заказы"],["🗂️","Архив заказов"],["✅","Чек-лист"],["🛠️","Управление прайсом"]];
document.getElementById("nav").innerHTML=navItems.map(x=>`<button onclick="go('${x[1]}')" id="n-${x[1]}">${x[0]} &nbsp; ${x[1]}</button>`).join("");

function loadPrice(){
  try{const saved=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(saved)&&saved.length)return saved}catch(e){}
  const copy=JSON.parse(JSON.stringify(initialPrice)); localStorage.setItem(KEY,JSON.stringify(copy)); return copy;
}
function savePrice(){localStorage.setItem(KEY,JSON.stringify(price))}
function saveEstimate(){localStorage.setItem(estimateKey,JSON.stringify(estimate))}
function go(page){current=page;currentCat=null;document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.getElementById("n-"+page).classList.add("active");render()}
function render(){document.getElementById("title").textContent=current;const c=document.getElementById("content");
 if(current==="Главная")return home(c); if(current==="Прайс")return pricePage(c); if(current==="Калькулятор")return calc(c);
 if(current==="Сметы и заказы")return orders(c); if(current==="Архив заказов")return archive(c);
 if(current==="Чек-лист")return checklist(c); if(current==="Управление прайсом")return editor(c);
}
function home(c){
 const count=price.reduce((s,x)=>s+x.items.length,0);
 c.innerHTML=`<div class="hero"><h2>Добро пожаловать,<br><span class="accent">ЭЛЕКТРИК МУРАД!</span></h2><p class="muted">Прайс, калькулятор и сметы в одном месте.</p><button class="btn" onclick="go('Прайс')">Открыть прайс →</button></div>
 <div class="grid"><div class="card"><div class="muted">Разделов</div><div class="stat">${price.length}</div></div><div class="card"><div class="muted">Позиций прайса</div><div class="stat">${count}</div></div><div class="card"><div class="muted">Позиций в смете</div><div class="stat">${estimate.length}</div></div><div class="card"><div class="muted">Сохранение</div><div class="stat">✓</div></div></div>
 <div class="card" style="margin-top:15px"><h3>Новый редактор прайса</h3><p class="muted">Можно самостоятельно добавлять разделы и услуги, менять цены и единицы измерения. Изменения сохраняются в браузере.</p><button class="btn blue" onclick="go('Управление прайсом')">Управлять прайсом</button></div>`;
}
function pricePage(c){
 if(currentCat!==null)return items(c);
 c.innerHTML=`<div class="actions no-print"><input class="search" style="max-width:500px" placeholder="Поиск по разделам..." oninput="filterCats(this.value)"><button class="btn blue" onclick="go('Управление прайсом')">🛠️ Редактировать прайс</button></div>
 <div class="catgrid" id="cats">${price.map((x,i)=>`<div class="cat" data-name="${esc(x.name).toLowerCase()}" onclick="openCat(${i})"><b>${i+1}. ${esc(x.name)}</b><span class="muted">${x.items.length} позиций</span></div>`).join("")}</div>`;
}
function filterCats(v){document.querySelectorAll(".cat").forEach(e=>e.style.display=e.dataset.name.includes(v.toLowerCase())?"block":"none")}
function openCat(i){currentCat=i;render()}
function items(c){
 const cat=price[currentCat];
 c.innerHTML=`<div class="actions no-print"><button class="btn secondary" onclick="currentCat=null;render()">← Все разделы</button><input class="search" style="max-width:360px" placeholder="Поиск по услугам..." oninput="filterItems(this.value)"><button class="btn blue" onclick="go('Управление прайсом')">Редактировать</button></div>
 <div class="card" style="margin-top:14px"><div class="section-head"><div class="section-title">${currentCat+1}. ${esc(cat.name)}</div><span class="muted">${cat.items.length} позиций</span></div>
 <div id="items">${cat.items.length?cat.items.map((x,i)=>`<div class="price-item" data-name="${esc(x[0]).toLowerCase()}"><div><b>${esc(x[0])}</b></div><div>${esc(x[1])}</div><div>${money(x[2])} ₽</div><div class="item-actions"><button class="btn" onclick="addItem(${currentCat},${i})">Добавить</button></div></div>`).join(""):`<div class="empty">В этом разделе пока нет позиций.</div>`}</div></div>`;
}
function filterItems(v){document.querySelectorAll("#items .price-item").forEach(e=>e.style.display=e.dataset.name.includes(v.toLowerCase())?"grid":"none")}
function addItem(ci,ii){const x=price[ci].items[ii];const found=estimate.find(e=>e.name===x[0]&&e.unit===x[1]&&Number(e.price)===Number(x[2]));if(found)found.qty=Number(found.qty||0)+1;else estimate.push({name:x[0],unit:x[1],price:Number(x[2]),qty:1});saveEstimate();render();showToast(`Добавлено: ${x[0]} × ${found?found.qty:1}`)}
function showToast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;right:18px;bottom:18px;background:#f4c400;color:#111;padding:12px 16px;border-radius:10px;font-weight:800;z-index:99;box-shadow:0 5px 20px #0008";document.body.appendChild(t)}t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",1800)}
function calc(c){
 const total=estimate.reduce((s,x)=>s+x.qty*x.price,0);
 c.innerHTML=`<div class="row"><div class="card"><h3>Добавление позиции</h3><p class="muted">Выбирай услуги в разделе «Прайс».</p><button class="btn" onclick="go('Прайс')">Открыть прайс</button></div><div class="card"><h3>Итого</h3><div class="stat">${money(total)} ₽</div></div></div>
 <div class="card" style="margin-top:14px"><table class="table"><thead><tr><th>№</th><th>Наименование</th><th>Ед.</th><th>Количество</th><th>Цена за 1</th><th>Сумма</th><th></th></tr></thead><tbody>${estimate.length?estimate.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td><div style="display:flex;gap:5px;align-items:center"><button class="btn secondary" style="padding:6px 10px" onclick="qty(${i},${Number(x.qty)-1})">−</button><input style="width:65px;text-align:center" type="number" min="1" value="${x.qty}" onchange="qty(${i},this.value)"><button class="btn" style="padding:6px 10px" onclick="qty(${i},${Number(x.qty)+1})">+</button></div></td><td>${money(x.price)} ₽</td><td>${money(x.qty*x.price)} ₽</td><td><button class="btn danger" onclick="del(${i})">×</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">Расчёт пуст. Открой «Прайс» и добавь позиции.</td></tr>`}</tbody></table>
 <div class="actions no-print" style="margin-top:15px"><button class="btn secondary" onclick="estimate=[];saveEstimate();render()">Очистить</button><button class="btn" onclick="go('Сметы и заказы')">Перейти к заказу</button></div></div>`;
}
function qty(i,v){estimate[i].qty=Math.max(1,Number(v)||1);saveEstimate();render()}
function del(i){estimate.splice(i,1);saveEstimate();render()}
function orders(c){
 const total=estimate.reduce((s,x)=>s+x.qty*x.price,0);
 c.innerHTML=`<div class="card"><h3>Информация о заказе</h3><div class="row"><div><label>Заказчик</label><input id="client" placeholder="ФИО заказчика"></div><div><label>Телефон</label><input id="phone" placeholder="Телефон"></div><div><label>Адрес</label><input id="address" placeholder="Адрес"></div><div><label>Дата</label><input id="date" type="date" value="${today()}"></div></div><div style="margin-top:12px"><label>Скидка (%)</label><input id="discount" type="number" min="0" max="100" value="0" oninput="updateOrderTotals()" style="max-width:180px"><div id="orderTotals" style="margin-top:12px"></div></div><div style="margin-top:12px"><label>Комментарий</label><textarea id="comment" placeholder="Комментарий" rows="3"></textarea></div></div>
 <div class="card" style="margin-top:14px"><h3>Выбранные работы и материалы</h3><table class="table print-table"><thead><tr><th>№</th><th>Позиция</th><th>Ед.</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th class="no-print"></th></tr></thead><tbody>${estimate.length?estimate.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td><div class="no-print" style="display:flex;gap:4px;align-items:center"><button class="btn secondary" style="padding:5px 9px" onclick="qtyOrder(${i},${Number(x.qty)-1})">−</button><input style="width:60px" type="number" min="1" value="${x.qty}" onchange="qtyOrder(${i},this.value)"><button class="btn" style="padding:5px 9px" onclick="qtyOrder(${i},${Number(x.qty)+1})">+</button></div><span class="print-only">${x.qty}</span></td><td>${money(x.price)} ₽</td><td>${money(x.qty*x.price)} ₽</td><td class="no-print"><button class="btn danger" style="padding:5px 9px" onclick="del(${i});orders(document.getElementById('content'))">×</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">Нет выбранных работ. Добавь позиции в «Прайсе».</td></tr>`}</tbody></table><div id="printTotals" class="total"></div><div class="actions no-print" style="margin-top:15px"><button class="btn green" onclick="saveOrder()">Сохранить заказ</button><button class="btn secondary" onclick="window.print()">Печать</button></div></div>`;
 updateOrderTotals();
}
function today(){return new Date().toISOString().slice(0,10)}
function getOrderForm(){return {client:document.getElementById("client")?.value||"",phone:document.getElementById("phone")?.value||"",address:document.getElementById("address")?.value||"",date:document.getElementById("date")?.value||today(),discount:Math.min(100,Math.max(0,Number(document.getElementById("discount")?.value)||0)),comment:document.getElementById("comment")?.value||""}}
function totals(){const subtotal=estimate.reduce((s,x)=>s+x.qty*x.price,0);const d=Math.min(100,Math.max(0,Number(document.getElementById("discount")?.value)||0));const amount=subtotal*d/100;return {subtotal,discount:d,discountAmount:amount,total:subtotal-amount}}
function updateOrderTotals(){const t=totals();const html=`<div><b>Сумма работ:</b> ${money(t.subtotal)} ₽</div><div><b>Скидка:</b> ${t.discount}% — ${money(t.discountAmount)} ₽</div><div style="font-size:24px;font-weight:900;margin-top:5px">К оплате: ${money(t.total)} ₽</div>`;const a=document.getElementById("orderTotals"),b=document.getElementById("printTotals");if(a)a.innerHTML=html;if(b)b.innerHTML=html}
function qtyOrder(i,v){estimate[i].qty=Math.max(1,Number(v)||1);saveEstimate();orders(document.getElementById("content"))}
function saveOrder(){const f=getOrderForm();const t=totals();const order={id:Date.now(),...f,subtotal:t.subtotal,discountAmount:t.discountAmount,total:t.total,items:JSON.parse(JSON.stringify(estimate))};ordersData.unshift(order);localStorage.setItem(ordersKey,JSON.stringify(ordersData));showToast("Заказ сохранён в архив");}
function archive(c){c.innerHTML=`<div class="card"><div class="section-head"><div><h3 style="margin:0">🗂️ Архив заказов</h3><div class="muted">Сохранённые заказчики, работы, скидки и суммы остаются в этом браузере.</div></div><button class="btn danger no-print" onclick="clearArchive()">Очистить архив</button></div></div><div style="margin-top:14px">${ordersData.length?ordersData.map((o,i)=>`<div class="card" style="margin-bottom:12px"><div class="section-head"><div><h3 style="margin:0">${esc(o.client||"Без имени")}</h3><div class="muted">${esc(o.date)} • ${esc(o.phone||"Телефон не указан")}</div><div class="muted">${esc(o.address||"Адрес не указан")}</div></div><div style="text-align:right"><div class="total">${money(o.total)} ₽</div><div class="muted">Скидка ${o.discount}% (${money(o.discountAmount)} ₽)</div></div></div><div class="actions no-print" style="margin-top:10px"><button class="btn secondary" onclick="viewOrder(${i})">Открыть</button><button class="btn danger" onclick="deleteOrder(${i})">Удалить</button></div></div>`).join(""):`<div class="empty">Архив пока пуст. Сохрани первый заказ в разделе «Сметы и заказы».</div>`}</div>`}
function viewOrder(i){const o=ordersData[i];estimate=JSON.parse(JSON.stringify(o.items||[]));saveEstimate();current="Сметы и заказы";render();setTimeout(()=>{document.getElementById("client").value=o.client||"";document.getElementById("phone").value=o.phone||"";document.getElementById("address").value=o.address||"";document.getElementById("date").value=o.date||today();document.getElementById("discount").value=o.discount||0;document.getElementById("comment").value=o.comment||"";updateOrderTotals()},0)}
function deleteOrder(i){if(!confirm("Удалить этот заказ из архива?"))return;ordersData.splice(i,1);localStorage.setItem(ordersKey,JSON.stringify(ordersData));render()}
function clearArchive(){if(!confirm("Очистить весь архив заказов?"))return;ordersData=[];localStorage.setItem(ordersKey,"[]");render()}
function panels(c){c.innerHTML=`<div class="grid">${["24 модуля","36 модулей","54 модуля","72 модуля","96 модулей"].map(x=>`<div class="card"><div class="stat">⚡</div><h3>Щит на ${x}</h3><p class="muted">Место для схемы, состава аппаратов и примечаний.</p><button class="btn secondary" onclick="alert('Раздел щита: ${x}')">Открыть</button></div>`).join("")}</div>`}
function materials(c){c.innerHTML=`<div class="grid">${["Гильзы ГМЛ","Наконечники НШВИ","Клеммы","DIN-рейка","Гофра","Крепёж","Маркировка","Расходники"].map(x=>`<div class="card"><h3>${x}</h3><p class="muted">Материалы для электромонтажа</p></div>`).join("")}</div>`}
function checklist(c){let a=["Обесточить линию","Проверить отсутствие напряжения","Проверить сечение кабеля","Проверить PE/N","Проверить затяжку клемм","Проверить УЗО/дифзащиту","Проверить маркировку","Сделать фото готового монтажа"];c.innerHTML=`<div class="card"><h3>Чек-лист перед сдачей работы</h3>${a.map(x=>`<label style="display:block;padding:13px;border-bottom:1px solid #333"><input type="checkbox"> ${x}</label>`).join("")}</div>`}

function editor(c){
 c.innerHTML=`<div class="actions no-print" style="margin-bottom:14px"><button class="btn green" onclick="addSection()">➕ Добавить новый раздел</button><button class="btn secondary" onclick="resetPrice()">↺ Вернуть исходный прайс</button></div>
 <div class="hint">Здесь можно полностью менять прайс: добавлять разделы, услуги, цены и единицы измерения. Изменения сохраняются автоматически в этом браузере.</div>
 <div style="margin-top:14px">${price.map((cat,ci)=>`<div class="card editor-section"><div class="section-head"><div><span class="section-title">${ci+1}. ${esc(cat.name)}</span><div class="muted">${cat.items.length} позиций</div></div><div class="actions no-print"><button class="btn secondary" onclick="renameSection(${ci})">Переименовать</button><button class="btn danger" onclick="removeSection(${ci})">Удалить раздел</button></div></div>
 <div style="margin-top:12px">${cat.items.map((x,ii)=>`<div class="editor-service"><input value="${attr(x[0])}" onchange="editItem(${ci},${ii},0,this.value)"><input value="${attr(x[1])}" onchange="editItem(${ci},${ii},1,this.value)"><input type="number" value="${Number(x[2])}" onchange="editItem(${ci},${ii},2,this.value)"><div class="item-actions no-print"><button class="btn danger" onclick="removeItem(${ci},${ii})">Удалить</button></div></div>`).join("")}</div>
 <div class="actions no-print" style="margin-top:12px"><button class="btn blue" onclick="addItemEditor(${ci})">➕ Добавить услугу</button></div></div>`).join("")}</div>`;
}
function addSection(){const name=prompt("Название нового раздела:");if(!name||!name.trim())return;price.push({name:name.trim(),items:[]});savePrice();render()}
function renameSection(i){const name=prompt("Новое название раздела:",price[i].name);if(name&&name.trim()){price[i].name=name.trim();savePrice();render()}}
function removeSection(i){if(!confirm("Удалить раздел и все его услуги?"))return;price.splice(i,1);savePrice();render()}
function addItemEditor(ci){const name=prompt("Название услуги:");if(!name||!name.trim())return;const unit=prompt("Единица измерения:","шт");if(!unit||!unit.trim())return;const val=prompt("Цена:","0");const n=Number(val);price[ci].items.push([name.trim(),unit.trim(),isNaN(n)?0:n]);savePrice();render()}
function editItem(ci,ii,col,val){if(col===2)price[ci].items[ii][col]=Number(val)||0;else price[ci].items[ii][col]=val;savePrice()}
function removeItem(ci,ii){if(!confirm("Удалить эту услугу?"))return;price[ci].items.splice(ii,1);savePrice();render()}
function resetPrice(){if(!confirm("Вернуть исходный прайс? Все внесённые вручную изменения будут удалены."))return;price=JSON.parse(JSON.stringify(initialPrice));savePrice();render()}
function money(n){return Number(n||0).toLocaleString("ru-RU")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function attr(s){return esc(s)}
go("Главная");
</script>
</body>
</html>
